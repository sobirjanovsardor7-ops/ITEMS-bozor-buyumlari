<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITEMS — Buyumlar bozori</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;font-family:Arial,sans-serif;color:#172033}
header{background:#171b35;color:white;padding:18px}
header h1{margin:0;color:#66e3b4}
header p{margin:5px 0 0}
main{max-width:900px;margin:20px auto;padding:12px}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:9px;font-size:16px}
input,select,textarea{border:1px solid #ddd;background:white}
button{border:0;background:#171b35;color:white;font-weight:bold}
.panel{background:white;padding:16px;border-radius:14px;margin-bottom:16px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}
.card img{width:100%;height:140px;object-fit:cover;background:#eee}
.info{padding:12px;overflow-wrap:anywhere}
.price{color:#087f55;font-size:19px;font-weight:bold}
.small{font-size:13px;color:#687386}
.hidden{display:none}
@media(min-width:650px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
<h1>ITEMS 🛍️</h1>
<p>O‘zbekiston onlayn buyumlar bozori</p>
</header>

<main>
<div class="panel">
<h2>🔎 Mahsulot qidirish</h2>
<input id="search" placeholder="Mahsulot nomini yozing...">
<select id="filter">
<option value="">Barcha kategoriyalar</option>
<option>Telefon</option>
<option>Kompyuter</option>
<option>Kiyim</option>
<option>Avtomobil</option>
<option>Uy jihozlari</option>
<option>Boshqa</option>
</select>
<button id="favorites">❤️ Sevimlilar</button>
<button id="all">Barcha mahsulotlar</button>
<p id="status">Sayt yuklanmoqda...</p>
</div>

<div class="panel">
<h2>➕ Mahsulot sotish</h2>
<p class="small">Mahsulot qo‘shish uchun Google orqali kirish kerak.</p>
<button id="login">Google orqali kirish</button>
<form id="form" class="hidden">
<input id="title" placeholder="Mahsulot nomi" required maxlength="100">
<input id="price" type="number" min="0" placeholder="Narxi (so‘m)" required>
<select id="category" required>
<option value="">Kategoriya tanlang</option>
<option>Telefon</option>
<option>Kompyuter</option>
<option>Kiyim</option>
<option>Avtomobil</option>
<option>Uy jihozlari</option>
<option>Boshqa</option>
</select>
<input id="location" placeholder="Shahar yoki tuman" required>
<input id="image" type="url" placeholder="Rasm URL manzili (ixtiyoriy)">
<input id="contact" placeholder="Telefon yoki @Telegram username" required>
<textarea id="description" placeholder="Mahsulot tavsifi"></textarea>
<button type="submit">Mahsulotni joylashtirish</button>
</form>
</div>

<h2>🛒 E'lonlar</h2>
<div id="products" class="products"></div>
<p id="empty"></p>
</main>

<script>
const SUPABASE_URL = "https://ytgxkltrgujzndkyjtrm.supabase.co";
const SUPABASE_KEY = "sb_publishable_rMhqdeNlm1u0_pg7rx5WYA_VK8HVNOj";

const client = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user = null;
let products = [];
let onlyFavorites = false;
let favorites = JSON.parse(localStorage.getItem("items_favorites") || "[]");

const $ = id => document.getElementById(id);

function safeText(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function imageURL(value){
 try{
  const u = new URL(value);
  return ["https:","http:"].includes(u.protocol) ? u.href : "";
 }catch{return ""}
}

function showStatus(text){$("status").textContent=text}

async function updateUser(){
 const {data,error}=await client.auth.getSession();
 if(error) console.error(error);
 user=data.session?.user || null;
 $("login").textContent=user ? "Hisobdan chiqish" : "Google orqali kirish";
 $("form").classList.toggle("hidden",!user);
}

$("login").onclick=async()=>{
 if(user){
  const {error}=await client.auth.signOut();
  if(error) alert(error.message);
  await updateUser();
 }else{
  const {error}=await client.auth.signInWithOAuth({
   provider:"google",
   options:{redirectTo:location.origin+location.pathname}
  });
  if(error) alert("Google login xatosi: "+error.message);
 }
};

client.auth.onAuthStateChange((_event,session)=>{
 user=session?.user || null;
 $("login").textContent=user ? "Hisobdan chiqish" : "Google orqali kirish";
 $("form").classList.toggle("hidden",!user);
});

async function loadProducts(){
 showStatus("Mahsulotlar yuklanmoqda...");
 const {data,error}=await client.from("products")
  .select("*").order("created_at",{ascending:false});
 if(error){
  console.error(error);
  showStatus("Xato: "+error.message);
  return;
 }
 products=data||[];
 render();
 showStatus("Jami mahsulotlar: "+products.length);
}

function render(){
 const q=$("search").value.trim().toLowerCase();
 const category=$("filter").value;

 const list=products.filter(p=>{
  const text=[p.title,p.description,p.location,p.category].join(" ").toLowerCase();
  return text.includes(q)
   && (!category||p.category===category)
   && (!onlyFavorites||favorites.includes(p.id));
 });

 $("products").innerHTML=list.map(p=>{
  const img=imageURL(p.image_url);
  const contact=String(p.contact||"").trim();
  const phone=/^\+?[\d\s()-]{7,20}$/.test(contact);
  const telegram=/^@[a-zA-Z0-9_]{5,32}$/.test(contact);
  let link="";

  if(phone){
   link='<a href="tel:'+safeText(contact.replace(/[^\d+]/g,""))+'">📞 Qo‘ng‘iroq</a>';
  }else if(telegram){
   link='<a target="_blank" rel="noopener" href="https://t.me/'+encodeURIComponent(contact.slice(1))+'">Telegram</a>';
  }

  return '<article class="card">'+
   '<img src="'+safeText(img||"https://placehold.co/400x300?text=ITEMS")+'" alt="Mahsulot" loading="lazy">'+
   '<div class="info">'+
   '<div class="price">'+Number(p.price).toLocaleString("uz-UZ")+' so‘m</div>'+
   '<h3>'+safeText(p.title)+'</h3>'+
   '<p class="small">'+safeText(p.category)+' · 📍 '+safeText(p.location)+'</p>'+
   '<p>'+safeText(p.description||"")+'</p>'+
   link+
   '<button onclick="toggleFavorite('+JSON.stringify(p.id).replace(/"/g,"&quot;")+')">'+
   (favorites.includes(p.id)?"❤️ Saqlangan":"🤍 Sevimli")+'</button>'+
   (user&&user.id===p.user_id?
    '<button onclick="deleteProduct('+JSON.stringify(p.id).replace(/"/g,"&quot;")+')">🗑 O‘chirish</button>':"")+
   '</div></article>';
 }).join("");

 $("empty").textContent=list.length?"":"Hozircha mahsulot topilmadi.";
}

function toggleFavorite(id){
 favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];
 localStorage.setItem("items_favorites",JSON.stringify(favorites));
 render();
}

$("form").onsubmit=async e=>{
 e.preventDefault();
 if(!user)return alert("Avval Google orqali kiring.");

 const title=$("title").value.trim();
 const price=Number($("price").value);
 const category=$("category").value;
 const locationText=$("location").value.trim();
 const image=$("image").value.trim();
 const contact=$("contact").value.trim();
 const description=$("description").value.trim();

 if(!title||!category||!locationText||!contact||!Number.isFinite(price)||price<0){
  alert("Ma'lumotlarni tekshiring.");
  return;
 }
 if(image&&!imageURL(image)){
  alert("Rasm URL manzili noto‘g‘ri.");
  return;
 }

 showStatus("Saqlanmoqda...");
 const {error}=await client.from("products").insert([{
  title,price,category,location:locationText,
  image_url:image||null,contact,description,user_id:user.id
 }]);

 if(error){
  showStatus("Saqlash xatosi: "+error.message);
  return;
 }
 $("form").reset();
 await loadProducts();
 showStatus("Mahsulot joylashtirildi!");
};

async function deleteProduct(id){
 if(!user||!confirm("Mahsulotni o‘chirasizmi?"))return;
 const {error}=await client.from("products").delete()
  .eq("id",id).eq("user_id",user.id);
 if(error){alert(error.message);return}
 await loadProducts();
}

$("search").oninput=render;
$("filter").onchange=render;
$("favorites").onclick=()=>{onlyFavorites=true;render()};
$("all").onclick=()=>{onlyFavorites=false;render()};

async function start(){
 if(SUPABASE_URL==="https://ytgxkltrgujzndkyjtrm.supabase.co"||
    SUPABASE_KEY==="sb_publishable_rMhqdeNlm1u0_pg7rx5WYA_VK8HVNOj"){
  showStatus("XATO: Supabase URL va Publishable key ni kiriting.");
  return;
 }
 await updateUser();
 await loadProducts();
}
start();
</script>
</body>
</html>
